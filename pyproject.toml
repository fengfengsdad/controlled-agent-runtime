[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "controlled-agent-runtime"
version = "0.1.0"
description = "Controlled Agent Runtime for Engineering Change Delivery (2-week GenAI platform MVP)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "httpx>=0.27.0",
  "langgraph>=0.2.0",
  "langchain-core>=0.3.0",
  "opentelemetry-api>=1.28.0",
  "opentelemetry-sdk>=1.28.0",
  "opentelemetry-instrumentation-fastapi>=0.49b0",
  "python-multipart>=0.0.12",
  "eval-type-backport>=0.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.7.0",
]
# Local cross-encoder reranking. Optional because it pulls in torch; the runtime
# falls back to the deterministic offline reranker when it is absent.
rerank = [
  "sentence-transformers>=3.0.0",
]

[project.scripts]
agent-runtime = "agent_runtime.api.main:run"
agent-eval = "agent_runtime.eval_cli:main"
requirement-mcp-server = "agent_runtime.tools.mcp_requirement_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "BLE", "UP", "RUF", "FURB"]
ignore = [
  # Pydantic resolves model annotations at runtime and the supported floor is
  # Python 3.9, so typing.Optional / typing.List stay until the floor moves.
  "UP006",
  "UP007",
  "UP035",
  "UP045",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
