services:
  agent-runtime:
    build: .
    env_file: .env
    ports:
      - "8080:8080"
    environment:
      LLM_PROVIDER: stub
      EMBEDDING_PROVIDER: stub
      PROMPT_VERSION: v1
    volumes:
      - runtime-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  runtime-data:
